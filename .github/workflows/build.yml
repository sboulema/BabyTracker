name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'feature/**'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker Build
        uses: docker/build-push-action@v7
        with:
          push: false
          tags: babytracker:local
