name: Build

on:
  pull_request:
    branches:
      - main
      - 'vibe/**'
      - 'feature/**'
  push:
    branches:
      - main
      - 'vibe/**'
      - 'feature/**'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build and test
        run: dotnet test tests/BabyTracker.Tests.csproj --configuration Release --verbosity normal

      - name: Docker Build
        uses: docker/build-push-action@v7
        with:
          push: false
          tags: babytracker:local
