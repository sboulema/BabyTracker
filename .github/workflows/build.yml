name: Build

on:
  pull_request:
    branches:
      - main
      - 'vibe/**'
      - 'feature/**'
  push:
    branches:
      - main
      - 'vibe/**'
      - 'feature/**'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build main project
        run: dotnet build src/BabyTracker.csproj --no-restore --configuration Release

      - name: Build test project
        run: dotnet build tests/BabyTracker.Tests.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test tests/BabyTracker.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Docker Build
        uses: docker/build-push-action@v7
        with:
          push: false
          tags: babytracker:local
