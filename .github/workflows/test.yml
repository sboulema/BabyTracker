name: Test

on:
  pull_request:
    branches:
      - main
      - 'vibe/**'
  push:
    branches:
      - main
      - 'vibe/**'
      - 'feature/**'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/BabyTracker.csproj

      - name: Build
        run: dotnet build src/BabyTracker.csproj --no-restore --configuration Release

      - name: Restore test dependencies
        run: dotnet restore tests/BabyTracker.Tests.csproj

      - name: Build tests
        run: dotnet build tests/BabyTracker.Tests.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test tests/BabyTracker.Tests.csproj --no-build --configuration Release --verbosity normal
